name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal scripts/*.go)"
          go vet ./...
          bash -n scripts/install.sh
          go test -race -timeout 90s -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ { if ($3 + 0 < 80) exit 1 }'
      - name: Build supported targets
        shell: bash
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$RUNNER_TEMP/proxctl-$os-$arch" ./cmd/proxctl
            done
          done
      - name: Verify candidate service before release
        shell: bash
        run: |
          go build -ldflags="-X main.version=ci-${GITHUB_SHA}" -o "$RUNNER_TEMP/proxctl-candidate" ./cmd/proxctl
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/verify-install.py --binary "$RUNNER_TEMP/proxctl-candidate" --expected-version "ci-${GITHUB_SHA}" --systemd
          else
            python3 scripts/verify-install.py --binary "$RUNNER_TEMP/proxctl-candidate" --expected-version "ci-${GITHUB_SHA}"
          fi
